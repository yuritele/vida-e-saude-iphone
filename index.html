<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida+ · iPhone 16</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f2f9;--s:#fff;--s2:#e9e7f5;--tx:#1b1840;--mut:#6d6a93;--in:#1d1a4f;--m:#3ee0b0;--c:#ff8f6b;--v:#a99bff;--bd:#dedbf0;font-family:"Bricolage Grotesque",system-ui,sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e24;--s:#191740;--s2:#25225a;--tx:#f1efff;--mut:#9f9bd0;--in:#2b2680;--bd:#2d2a63}}
:root[data-theme="dark"]{--bg:#0f0e24;--s:#191740;--s2:#25225a;--tx:#f1efff;--mut:#9f9bd0;--in:#2b2680;--bd:#2d2a63}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:#0c0b1c;color:var(--tx);display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh}
.phone{width:417px;height:876px;flex:none;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;transform:scale(var(--k,1))}

.phone{border:12px solid #000;border-radius:64px}.top{padding-top:62px}nav{bottom:28px}main{padding-bottom:116px}
.sb{display:flex;position:absolute;top:0;left:0;right:0;height:56px;padding:20px 34px 0;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:16px;z-index:5;pointer-events:none}
.sb span{display:flex;gap:6px;align-items:center;margin-top:3px}
.sb svg rect{fill:currentColor}
.di{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:6;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:width .3s,margin-left .3s,height .3s}
.di span{opacity:0;transition:opacity .2s;white-space:nowrap;font-size:13px;font-weight:600}
.di.on{width:210px;margin-left:-105px;height:40px}
.di.on span{opacity:1}
.hi{display:block;position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:var(--tx);opacity:.8;border-radius:3px;z-index:6}
.top{padding:20px 22px 8px;display:flex;justify-content:space-between;align-items:flex-end}
.top small{color:var(--mut);font-size:13px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.av{width:42px;height:42px;border-radius:50% 50% 50% 14px;background:var(--c);display:grid;place-items:center;font-weight:800;color:#2a1208}
main{flex:1;overflow-y:auto;padding:10px 16px 96px}
.hero{background:var(--in);color:#fff;border-radius:32px 32px 32px 8px;padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:14px}
.rw{position:relative;width:140px;flex:none}
.rw svg{transform:rotate(-90deg);display:block}
.sc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.sc b{font-size:34px;font-weight:800;line-height:1}
.sc span{font-size:11px;opacity:.7}
.lg{flex:1;display:grid;gap:12px}
.lg div{display:flex;gap:8px;align-items:center;font-size:13px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}
.lg b{display:block;font-size:17px}
.lg em{font-style:normal;opacity:.7;font-size:11px;display:block}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-bottom:14px}
.t{background:var(--s);border:1px solid var(--bd);padding:16px;cursor:pointer;text-align:left;color:var(--tx);font:inherit}
.t:nth-child(1){border-radius:26px 26px 8px 26px}
.t:nth-child(2){border-radius:26px 8px 26px 26px}
.t:nth-child(3){border-radius:26px 26px 26px 8px}
.t:nth-child(4){border-radius:8px 26px 26px 26px;background:var(--c);color:#2a1208;border-color:var(--c)}
.t small{font-size:12px;color:var(--mut)}
.t:nth-child(4) small{color:#5a2c18}
.t h3{font-size:26px;font-weight:800;margin:4px 0 10px;letter-spacing:-.5px}
.t h3 u{text-decoration:none;font-size:13px;font-weight:400;color:var(--mut)}
.btn{border:0;background:var(--m);color:#06382a;border-radius:14px;padding:9px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.g{background:var(--s2);color:var(--tx)}
.btn.w{width:100%;padding:13px;font-size:16px}
.row{display:flex;gap:8px}
.box{background:var(--s);border:1px solid var(--bd);border-radius:26px;padding:16px;margin-bottom:14px}
.box h2{font-size:15px;font-weight:600;margin-bottom:10px}
.moods{display:flex;justify-content:space-between}
.moods button{font-size:26px;background:var(--s2);border:2px solid transparent;border-radius:18px 18px 18px 6px;padding:8px;cursor:pointer}
.moods button.on{border-color:var(--v);background:var(--bd)}
.bar{height:12px;background:var(--s2);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--m);border-radius:8px;transition:width .4s}
.med{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:8px;background:var(--s);border:1px solid var(--bd);border-radius:20px;cursor:pointer}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--v);display:grid;place-items:center;font-weight:800;color:var(--in);flex:none}
.med.done{background:var(--s2)}
.med.done .chk{background:var(--m);border-color:var(--m)}
.med.done b{text-decoration:line-through;color:var(--mut)}
.med small{color:var(--mut);display:block}
.med span{margin-left:auto;font-weight:600}
input{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--v);outline-offset:2px}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.big small{font-size:15px;font-weight:400;color:var(--mut);letter-spacing:0}
.scale{height:14px;border-radius:8px;position:relative;margin:18px 0 8px;background:linear-gradient(90deg,#5aa9ff 0 14%,var(--m) 14% 40%,#ffc14a 40% 60%,var(--c) 60%)}
.scale i{position:absolute;top:-6px;width:6px;height:26px;border-radius:4px;background:var(--tx);transition:left .4s}
nav{position:absolute;left:16px;right:16px;bottom:14px;display:flex;background:var(--in);border-radius:28px;padding:6px;box-shadow:0 8px 24px rgba(10,8,40,.35)}
nav button{flex:1;background:none;border:0;color:#b9b5ee;font:600 11px inherit;font-family:inherit;padding:8px 0;border-radius:22px;cursor:pointer;display:grid;place-items:center;gap:2px}
nav button.on{background:var(--m);color:#06382a}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.res{margin-top:6px;font-weight:600}
</style>
</head>
<body>
<div class="phone">
 <div class="di" id="di" role="button" aria-label="Ilha Dinâmica" onclick="this.classList.toggle('on');updIsland()"><span id="dt2"></span></div><div class="hi"></div>
 <div class="sb"><b id="clk">9:41</b><span><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 14 0M4 7.3a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10.3" r="1" fill="currentColor" stroke="none"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" style="fill:none;stroke:currentColor;opacity:.4"/><rect x="2" y="2" width="20" height="9" rx="2.2"/><rect x="25" y="4.5" width="1.5" height="4" rx=".7" opacity=".4"/></svg></span></div>
 <div class="top"><div><small id="dt"></small><h1 id="ttl"></h1></div><div class="av">V</div></div>
 <main id="main"></main>
 <nav id="nav">
  <button data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-t="cal"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 6.5 6 10a6 6 0 0 1-12 0c0-2 1-3.5 2-5 .5 2 2 2.5 2 2 0-3 0-5 2-7z"/></svg>Dieta</button>
  <button data-t="med"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/></svg>Remédios</button>
  <button data-t="imc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-3"/></svg>IMC</button>
 </nav>
</div>
<script>
const KEY="vidaplus";
let S={water:3,goal:8,steps:6240,mood:null,meds:[{n:"Vitamina D",h:"08:00",d:false},{n:"Losartana 50mg",h:"12:00",d:false},{n:"Ômega 3",h:"20:00",d:false}]};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=x}catch(e){}
S.cal=S.cal||[];S.calGoal=S.calGoal||2000;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const FOODS={"Arroz branco cozido":128,"Arroz integral cozido":124,"Feijão carioca cozido":76,"Feijão preto cozido":77,"Macarrão cozido":102,"Batata cozida":52,"Batata-doce cozida":77,"Mandioca cozida":125,"Pão francês":300,"Pão integral":253,"Aveia em flocos":394,"Cuscuz de milho":113,"Peito de frango grelhado":159,"Carne bovina grelhada (patinho)":219,"Carne moída refogada":212,"Tilápia grelhada":128,"Ovo cozido":146,"Ovo frito":240,"Presunto":145,"Queijo mussarela":330,"Leite integral":61,"Iogurte natural":51,"Banana prata":98,"Maçã":56,"Laranja":37,"Mamão":40,"Manga":64,"Melancia":33,"Abacate":96,"Tomate":15,"Alface":11,"Cenoura cozida":30,"Brócolis cozido":25,"Azeite de oliva":884,"Manteiga":726,"Açúcar":387,"Amendoim":544,"Castanha-do-pará":643,"Biscoito cream cracker":432,"Chocolate ao leite":540,"Pizza de mussarela":267};
let tab="home";
const now=new Date(),hr=now.getHours();
document.getElementById("clk").textContent=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
document.getElementById("dt").textContent=now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const Cc=r=>2*Math.PI*r;
const ring=(r,p,col)=>`<circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="10"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${Cc(r)}" stroke-dashoffset="${Cc(r)*(1-Math.min(p,1))}" style="transition:stroke-dashoffset .5s"/>`;
const go=t=>{tab=t;render()};
const esc=x=>x.replace(/</g,"&lt;");
function render(){
 const m=document.getElementById("main"),t=S.cal.reduce((a,x)=>a+x.k,0),md=S.meds.filter(x=>x.d).length;
 document.getElementById("ttl").textContent={home:hr<12?"Bom dia":hr<18?"Boa tarde":"Boa noite",cal:"Sua dieta",med:"Remédios",imc:"Seu IMC"}[tab];
 if(tab=="home"){
  const sp=S.steps/10000,wp=S.water/S.goal,cp=t/S.calGoal,mp=md/S.meds.length;
  const sc=Math.round((Math.min(sp,1)+Math.min(wp,1)+mp)/3*100);
  m.innerHTML=`<div class="hero"><div class="rw"><svg viewBox="0 0 140 140" width="140" height="140">${ring(62,sp,"#fff")}${ring(49,wp,"#3ee0b0")}${ring(36,cp,"#ff8f6b")}</svg><div class="sc"><b>${sc}</b><span>pontos</span></div></div>
  <div class="lg"><div><i style="background:#fff"></i><span><b>${Math.round(Math.min(sp,1)*100)}%</b><em>passos</em></span></div><div><i style="background:#3ee0b0"></i><span><b>${Math.round(Math.min(wp,1)*100)}%</b><em>água</em></span></div><div><i style="background:#ff8f6b"></i><span><b>${Math.round(cp*100)}%</b><em>calorias</em></span></div></div></div>
  <div class="grid">
  <div class="t" onclick="go('home')"><small>Passos</small><h3>${S.steps.toLocaleString("pt-BR")}</h3><button class="btn g" onclick="S.steps+=500;save();render()">+500</button></div>
  <div class="t" onclick="go('home')"><small>Água</small><h3>${S.water}<u>/${S.goal}</u></h3><div class="row"><button class="btn g" aria-label="menos" onclick="S.water=Math.max(0,S.water-1);save();render()">−</button><button class="btn" aria-label="mais" onclick="S.water++;save();render()">+</button></div></div>
  <button class="t" onclick="go('med')"><small>Remédios</small><h3>${md}<u>/${S.meds.length}</u></h3><small>tomados hoje</small></button>
  <button class="t" onclick="go('cal')"><small>Calorias</small><h3>${t}<u> kcal</u></h3><small>toque para registrar</small></button></div>
  <div class="box"><h2>Como você se sente?</h2><div class="moods">${["😞","😕","😐","🙂","😄"].map((e,i)=>`<button class="${S.mood===i?"on":""}" onclick="S.mood=${i};save();render()">${e}</button>`).join("")}</div></div>`;
 }else if(tab=="med"){
  m.innerHTML=`<div class="box"><div class="big">${md}<small> de ${S.meds.length} tomados</small></div><div class="bar"><i style="width:${md/S.meds.length*100}%"></i></div></div>
  ${S.meds.map((x,i)=>`<div class="med ${x.d?"done":""}" onclick="S.meds[${i}].d=!S.meds[${i}].d;save();render()"><div class="chk">${x.d?"✓":""}</div><div><b>${x.n}</b></div><span>${x.h}</span></div>`).join("")}
  <button class="btn g w" onclick="S.meds.forEach(x=>x.d=false);save();render()">Reiniciar o dia</button>`;
 }else if(tab=="cal"){
  const r=S.calGoal-t;
  m.innerHTML=`<div class="hero" style="display:block"><div class="big">${r>=0?r:-r}<small style="color:#cfcaff"> kcal ${r>=0?"restantes":"acima da meta"}</small></div><div class="bar" style="background:rgba(255,255,255,.14)"><i style="width:${Math.min(t/S.calGoal*100,100)}%;background:${r<0?"var(--c)":"var(--m)"}"></i></div><small style="opacity:.75">${t} de ${S.calGoal} kcal consumidas</small></div>
  <div class="box"><h2>Adicionar alimento</h2><input id="n" list="fl" placeholder="Escolha ou digite o alimento" oninput="prev()" autocomplete="off"><datalist id="fl">${Object.keys(FOODS).map(x=>`<option value="${x}">`).join("")}</datalist><input id="g" type="number" inputmode="numeric" placeholder="Quantidade em gramas" oninput="prev()"><div id="pv" style="color:var(--mut);font-weight:600;min-height:20px;margin-bottom:8px"></div><input id="k" type="number" inputmode="numeric" placeholder="Calorias totais (kcal)" style="display:none"><button class="btn w" onclick="addCal()">Adicionar</button></div>
  <div class="box"><h2>Hoje você comeu</h2>${S.cal.length?S.cal.map((x,i)=>`<div class="row" style="align-items:center;padding:8px 0"><b style="flex:1;font-weight:600">${esc(x.n)}</b><span>${x.k} kcal</span><button class="btn g" style="padding:4px 10px" aria-label="remover" onclick="S.cal.splice(${i},1);save();render()">✕</button></div>`).join(""):"<small style='color:var(--mut)'>Nada registrado ainda. Escolha um alimento acima.</small>"}</div>
  <button class="btn g w" onclick="const g=parseInt(prompt('Meta diária (kcal):',S.calGoal));if(g>0){S.calGoal=g;save();render()}">Alterar meta diária</button>`;
 }else{
  m.innerHTML=`<div class="box"><input id="w" type="number" inputmode="decimal" placeholder="Peso (kg)"><input id="h" type="number" inputmode="decimal" placeholder="Altura (cm)"><button class="btn w" onclick="imc()">Calcular IMC</button><div id="r"></div></div>`;
 }
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 updIsland();
}
function updIsland(){const e=document.getElementById("dt2");if(e)e.textContent="👟 "+S.steps.toLocaleString("pt-BR")+"  💧 "+S.water+"/"+S.goal+"  💊 "+S.meds.filter(x=>x.d).length+"/"+S.meds.length}
function prev(){
 const n=document.getElementById("n").value.trim(),g=+document.getElementById("g").value,f=FOODS[n];
 document.getElementById("k").style.display=(n&&f===undefined)?"block":"none";
 document.getElementById("pv").textContent=f!==undefined?(g>0?"= "+Math.round(f*g/100)+" kcal":"")+" ("+f+" kcal/100 g)":(n?"Fora da base: informe as calorias totais":"");
}
function addCal(){
 const n=document.getElementById("n").value.trim(),g=Math.round(+document.getElementById("g").value),f=FOODS[n];
 let k,name;
 if(f!==undefined){if(!(g>0))return;k=Math.round(f*g/100);name=n+" · "+g+" g"}
 else{k=Math.round(+document.getElementById("k").value);if(!n||!(k>0))return;name=g>0?n+" · "+g+" g":n}
 S.cal.push({n:name,k});save();render();
}
function imc(){
 const w=+document.getElementById("w").value,h=+document.getElementById("h").value/100,r=document.getElementById("r");
 if(!w||!h){r.innerHTML="";return}
 const v=w/(h*h),c=v<18.5?"Abaixo do peso":v<25?"Peso normal":v<30?"Sobrepeso":"Obesidade",p=Math.min(Math.max((v-15)/25,0),1)*100;
 r.innerHTML=`<div class="big" style="margin-top:18px">${v.toFixed(1)}</div><div class="scale"><i style="left:calc(${p}% - 3px)"></i></div><div class="res">${c}</div>`;
}
function fit(){document.querySelector(".phone").style.setProperty("--k",Math.min(innerWidth/417,innerHeight/876,1))}
fit();addEventListener("resize",fit);
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t)};
render();
</script>
</body>
</html>
